<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Delegation</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{
            "delegation": "./"
        }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <!--
      Role-based navigation happens off this SAME url/index.html via query
      params, e.g.:
        index.html?email=jane.doe@example.com&role=Admin      -> Admin Delegation UI
        index.html?email=john.roe@example.com&role=Approver   -> My Delegation UI
      See Component.js -> _createAppModel() for the logic.
    -->
    <div
        data-sap-ui-component
        data-name="delegation"
        data-id="container"
        data-settings='{"id" : "delegation"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
